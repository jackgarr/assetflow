<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 15px 25px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 70px);
            padding-top: 120px;
            box-sizing: border-box;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- Top title bar -->
    <div class="navbar">AssetFlow</div>

    <!-- Main login container -->
    <div class="login-container">
        <div class="login-box">
            <h2>System Login</h2>
            <div class="subtitle">Please sign in to continue</div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <!-- Login form -->
            <form method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
